<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><meta name="robots" content="noindex"><meta name="description" content="Jogue Snake Grid com teclado ou toque. Planeje o caminho, coma e supere seu recorde."><link rel="icon" type="image/svg+xml" href="./assets/snake.svg"><title>Snake Grid — NunesDevs</title><link rel="stylesheet" href="./style.css"><script type="module" src="./main.mjs"></script></head>
<body><main class="playground" id="playground">
<header class="intro"><p class="eyebrow">PLAYGROUND / 03</p><h1>Snake Grid</h1><p class="description">Planeje o caminho. Cresça a cada movimento.</p></header>
<section class="panel" aria-label="Jogo Snake Grid">
<dl class="metrics"><div class="metric"><dt>Pontos</dt><dd id="score">00000</dd></div><div class="metric"><dt>Recorde</dt><dd id="best">00000</dd></div><div class="metric"><dt>Ritmo</dt><dd id="speed">8/s</dd></div></dl>
<div class="stage snake-stage" id="stage" tabindex="0" role="group" aria-label="Tabuleiro Snake" aria-describedby="instructions" data-status="ready"><canvas id="world" aria-hidden="true"></canvas><div class="state-overlay snake-overlay" id="overlay"><h2 id="state-title">Um caminho. Muitas escolhas.</h2><p id="state-hint">Coma, cresça e evite as paredes.</p><button class="primary" id="state-action" type="button">Começar</button></div></div>
<div class="controls"><div class="actions"><button class="primary" id="toggle" type="button">Começar</button><button id="reset" type="button">Reiniciar</button></div><label class="setting"><span class="sr-only">Velocidade inicial — altera e reinicia a partida</span><select id="rate"><option value="6">6 movimentos/s</option><option value="8" selected>8 movimentos/s</option><option value="12">12 movimentos/s</option></select></label></div>
<div class="touch-pad" role="group" aria-label="Direção da cobra"><button type="button" data-direction="left" aria-label="Mover para a esquerda">←</button><button type="button" data-direction="up" aria-label="Mover para cima">↑</button><button type="button" data-direction="down" aria-label="Mover para baixo">↓</button><button type="button" data-direction="right" aria-label="Mover para a direita">→</button></div>
<p class="sr-only" id="announcement" role="status" aria-live="polite">Pronto para jogar.</p>
</section><p class="keyboard-help" id="instructions">Setas / WASD: mover · P: pausar · R: reiniciar</p><noscript>Ative o JavaScript para jogar.</noscript></main></body></html>
